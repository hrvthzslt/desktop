---
- name: install
  ansible.builtin.dnf:
    name:
      - git
      - make
      - gcc
      - libX11-devel
      - libXft-devel
      - libXinerama-devel
      - libXrandr-devel
      - libXfixes-devel
      - xorg-x11-server-Xorg
      - libnotify
      - lm_sensors
      - sysstat
      - acpi
      - ddcutil
      - ncdu
      - nitrogen
      - arandr
      - autorandr
      - dunst
      - gnome-keyring
      - alacritty
      - flameshot
      - screenkey
      - thunar
      - brightnessctl
      - xsel
      - zip
      - unzip
      - nmtui
    state: present
  become: yes

- name: make brightnessctl runnable without sudo
  ansible.builtin.shell: 'sudo chmod +s "$(which brightnessctl)"'
  become: yes
