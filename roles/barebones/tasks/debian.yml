---
- name: install
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    - pmount
    - psmisc
    - alsa-utils
    - pulseaudio
    - pulseaudio-utils
    - pavucontrol
    - pulseaudio-module-bluetooth
    - bluez
    - bluez-firmware
    - bluetooth
    - blueman
    - xinit
    - network-manager
    - keychain
    - gmtp
    - gvfs-backends
    - power-profiles-daemon
  become: yes

- name: Symlink xinitrc
  ansible.builtin.file:
    src: "{{ role_path }}/files/xinit/.xinitrc"
    dest: ~/.xinitrc
    state: link
    force: yes

- name: Ensure .profile contains startx command
  ansible.builtin.lineinfile:
    path: ~/.profile
    line: "if [[ -z $DISPLAY ]] && [[ $(tty) = /dev/tty1 ]]; then exec startx; fi"
    state: present
    insertafter: EOF
    create: yes
